<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="BenchLog - a workshop memory for makers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BenchLog</title>
  <desc>BenchLog banner: a dark blueprint grid with a scanning QR tag, status LEDs and stock bars.</desc>
  <style>
    .title { font: 700 92px Inter, 'Segoe UI', system-ui, sans-serif; fill: #ffffff; letter-spacing: -2px; }
    .tag   { font: 500 26px Inter, 'Segoe UI', system-ui, sans-serif; fill: #8fb3d1; }
    .chips { font: 600 17px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #5cc8ff; letter-spacing: 1.5px; }
    .scan  { animation: scan 2.8s ease-in-out infinite; }
    .b1    { animation: blink 2.4s ease-in-out infinite; }
    .b2    { animation: blink 2.4s ease-in-out .8s infinite; }
    .b3    { animation: blink 2.4s ease-in-out 1.6s infinite; }
    @keyframes scan  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(116px); } }
    @keyframes blink { 0%, 60%, 100% { opacity: 1; } 30% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .b1, .b2, .b3 { animation: none; }
    }
  </style>
  <defs>
    <pattern id="minor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#15304d" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#1f4570" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="#0b1420"/>
  <rect width="1280" height="340" fill="url(#minor)"/>
  <rect width="1280" height="340" fill="url(#major)"/>

  <g transform="translate(1160 290)" fill="none" stroke="#1f4570" stroke-width="2" opacity="0.9">
    <circle r="84"/>
    <circle r="30"/>
    <circle r="106" stroke-dasharray="7 6" stroke-width="1.5"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(0)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(45)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(90)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(135)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(180)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(225)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(270)"/>
    <rect x="-10" y="-118" width="20" height="26" transform="rotate(315)"/>
  </g>

  <text class="title" x="72" y="150">Bench<tspan fill="#5cc8ff">Log</tspan></text>
  <text class="tag" x="76" y="204">A workshop memory for makers and people with too many tools.</text>
  <text class="chips" x="76" y="262">TOOL PROFILES  /  QR TAGS  /  MAINTENANCE  /  STOCK</text>

  <g transform="translate(900 56)">
    <rect width="260" height="228" rx="14" fill="#12202f" stroke="#2f5273" stroke-width="2"/>

    <g transform="translate(24 24)">
      <rect width="120" height="120" rx="6" fill="#e6f1f9"/>
      <rect x="8" y="8" width="30" height="30" fill="#0b1420"/>
      <rect x="17" y="17" width="12" height="12" fill="#e6f1f9"/>
      <rect x="82" y="8" width="30" height="30" fill="#0b1420"/>
      <rect x="91" y="17" width="12" height="12" fill="#e6f1f9"/>
      <rect x="8" y="82" width="30" height="30" fill="#0b1420"/>
      <rect x="17" y="91" width="12" height="12" fill="#e6f1f9"/>
      <rect x="50" y="10" width="10" height="10" fill="#0b1420"/>
      <rect x="64" y="24" width="10" height="10" fill="#0b1420"/>
      <rect x="48" y="46" width="12" height="12" fill="#0b1420"/>
      <rect x="70" y="52" width="10" height="10" fill="#0b1420"/>
      <rect x="92" y="56" width="12" height="12" fill="#0b1420"/>
      <rect x="52" y="72" width="10" height="10" fill="#0b1420"/>
      <rect x="76" y="80" width="14" height="14" fill="#0b1420"/>
      <rect x="98" y="92" width="10" height="10" fill="#0b1420"/>
      <rect x="62" y="98" width="10" height="10" fill="#0b1420"/>
      <rect x="0" y="0" width="120" height="4" fill="#3ddc97" class="scan"/>
    </g>

    <g>
      <circle class="b1" cx="180" cy="42" r="7" fill="#3ddc97"/>
      <path d="M200 42H238" stroke="#5b7a96" stroke-width="6" stroke-linecap="round"/>
      <circle class="b2" cx="180" cy="82" r="7" fill="#f5c542"/>
      <path d="M200 82H228" stroke="#5b7a96" stroke-width="6" stroke-linecap="round"/>
      <circle class="b3" cx="180" cy="122" r="7" fill="#ff6b6b"/>
      <path d="M200 122H234" stroke="#5b7a96" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g>
      <rect x="24" y="168" width="212" height="9" rx="4" fill="#1d3a55"/>
      <rect x="24" y="168" width="156" height="9" rx="4" fill="#3ddc97"/>
      <rect x="24" y="190" width="212" height="9" rx="4" fill="#1d3a55"/>
      <rect x="24" y="190" width="70" height="9" rx="4" fill="#f5c542"/>
    </g>
  </g>
</svg>
